name: Exercism Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Exercism CLI
        run: |
          wget https://github.com/exercism/cli/releases/download/v3.5.5/exercism-3.5.5-linux-x86_64.tar.gz
          tar -xzf exercism-3.5.5-linux-x86_64.tar.gz
          sudo mv exercism /usr/local/bin/

      - name: Configure and Download Solutions
        env:
          EXERCISM_TOKEN: ${{ secrets.EXERCISM_TOKEN }}
        run: |
          exercism configure --token=$EXERCISM_TOKEN
          exercism download

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync exercism solutions" && git push)
